AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  RAGnarok — serverless Discord bot for Ark: Survival Ascended (RAG).
  Milestone 1: the verifying interactions endpoint.

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 256

Resources:
  InteractionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/app/
      Handler: main.handler
      Environment:
        Variables:
          # Safe to hardcode: the Discord PUBLIC key is not a secret.
          DISCORD_PUBLIC_KEY: f428776da235244a009798aa72c1621536d64a2a58d94b3d9058e2ef17f908e3
      Events:
        Interactions:
          Type: HttpApi
          Properties:
            Path: /interactions
            Method: post

Outputs:
  InteractionsUrl:
    Description: Paste this into the Discord Developer Portal as the Interactions Endpoint URL.
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/interactions"
